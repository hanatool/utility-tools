<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple and modern Word Counter tool built with Bootstrap 5." />
  <meta name="keywords" content="word counter, text analyzer, bootstrap tool" />
  <meta name="author" content="Word Counter App" />

  <title>Word Counter Tool</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://hanapha.com/banner/popunder.js"></script>
</head>

<body class="bg-light text-dark">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fa-solid fa-keyboard me-2"></i> WordCounter
      </a>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="py-5 text-center bg-white border-bottom">
    <div class="container">
      <h1 class="fw-bold">Word Counter Tool</h1>
      <p class="text-muted mb-0">
        Quickly count words, characters, and sentences in real time.
      </p>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container my-5">

    <div class="row g-4">

      <!-- TOOL -->
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <label class="form-label fw-semibold">Enter Your Text</label>
            <textarea id="textInput" class="form-control" rows="8"
              placeholder="Type or paste your text here..."></textarea>

            <div class="row text-center mt-4">
              <div class="col-4">
                <div class="p-3 bg-primary text-white rounded">
                  <h5 id="wordCount">0</h5>
                  <small>Words</small>
                </div>
              </div>
              <div class="col-4">
                <div class="p-3 bg-success text-white rounded">
                  <h5 id="charCount">0</h5>
                  <small>Characters</small>
                </div>
              </div>
              <div class="col-4">
                <div class="p-3 bg-warning text-dark rounded">
                  <h5 id="sentenceCount">0</h5>
                  <small>Sentences</small>
                </div>
              </div>
            </div>

            <button class="btn btn-danger mt-3 w-100" onclick="clearText()">
              <i class="fa fa-trash"></i> Clear Text
            </button>
          </div>
        </div>
      </div>

      <!-- AD SECTION -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 mb-3">
          <div class="card-body text-center">
            <script src="https://hanapha.com/banner/ad.js"></script>
          </div>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-body text-center">
            <h6 class="text-muted">Sponsored</h6>
            <div class="border rounded p-5 bg-light">
              Ad Space 300x600
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-primary text-white text-center py-3 mt-5">
    <div class="container">
      <small>© <script type='text/javascript'>
          var creditsyear = new Date();
          document.write(creditsyear.getFullYear());
        </script> WordCounter Tool. All rights reserved.</small>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    const textInput = document.getElementById("textInput");

    textInput.addEventListener("input", updateStats);

    function updateStats() {
      let text = textInput.value.trim();

      // Words
      let words = text.length > 0 ? text.split(/\s+/).length : 0;

      // Characters
      let chars = text.length;

      // Sentences
      let sentences = text.length > 0 ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;

      document.getElementById("wordCount").innerText = words;
      document.getElementById("charCount").innerText = chars;
      document.getElementById("sentenceCount").innerText = sentences;
    }

    function clearText() {
      textInput.value = "";
      updateStats();
    }
  </script>

    <script src="https://hanapha.com/banner/socialbar.js"></script>
</body>

</html>
