<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Modern Base64 Encoder & Decoder Tool built with Bootstrap 5. Easy, fast, and responsive online utility." />
  <meta name="keywords" content="Base64, encoder, decoder, online tool, bootstrap tool" />
  <meta name="author" content="Base64 Tool" />

  <title>Base64 Encoder Tool</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://hanapha.com/banner/popunder.js"></script>
</head>

<body class="bg-light text-dark">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fa-solid fa-code text-primary me-2"></i> Base64 Tool
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#tool">Tool</a></li>
          <li class="nav-item"><a class="nav-link" href="#ads">Ads</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="py-5 bg-white border-bottom">
    <div class="container text-center">
      <h1 class="fw-bold">Base64 Encoder & Decoder</h1>
      <p class="text-muted">
        A simple, fast, and modern tool to encode and decode Base64 strings instantly.
      </p>
    </div>
  </header>

  <!-- MAIN TOOL -->
  <section id="tool" class="py-5">
    <div class="container">
      <div class="row g-4">

        <!-- TOOL BOX -->
        <div class="col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body">

              <label class="form-label fw-semibold">Input Text</label>
              <textarea id="inputText" class="form-control mb-3" rows="5" placeholder="Enter text here..."></textarea>

              <div class="d-flex flex-wrap gap-2 mb-3">
                <button class="btn btn-primary" onclick="encodeBase64()">
                  <i class="fa-solid fa-lock"></i> Encode
                </button>
                <button class="btn btn-success" onclick="decodeBase64()">
                  <i class="fa-solid fa-unlock"></i> Decode
                </button>
                <button class="btn btn-secondary" onclick="clearText()">
                  <i class="fa-solid fa-trash"></i> Clear
                </button>
              </div>

              <label class="form-label fw-semibold">Output</label>
              <textarea id="outputText" class="form-control" rows="5" readonly></textarea>

            </div>
          </div>
        </div>

        <!-- ADS SECTION -->
        <div class="col-lg-4" id="ads">
          <div class="text-center">
            <script src="https://hanapha.com/banner/ad.js"></script>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-white border-top py-4">
    <div class="container text-center">
      <p class="mb-0 text-muted">
        © <script type='text/javascript'>
          var creditsyear = new Date();
          document.write(creditsyear.getFullYear());
        </script> Base64 Tool. Built with Bootstrap 5.
      </p>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    function encodeBase64() {
      let input = document.getElementById("inputText").value;
      let encoded = btoa(unescape(encodeURIComponent(input)));
      document.getElementById("outputText").value = encoded;
    }

    function decodeBase64() {
      let input = document.getElementById("inputText").value;
      try {
        let decoded = decodeURIComponent(escape(atob(input)));
        document.getElementById("outputText").value = decoded;
      } catch (e) {
        document.getElementById("outputText").value = "Invalid Base64 string!";
      }
    }

    function clearText() {
      document.getElementById("inputText").value = "";
      document.getElementById("outputText").value = "";
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://hanapha.com/banner/socialbar.js"></script>
</body>

</html>
