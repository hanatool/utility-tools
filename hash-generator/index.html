<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hash Generator Tool</title>

  <meta name="description" content="A simple, fast, and secure hash generator tool using modern web technologies." />
  <meta name="keywords" content="hash generator, sha256, encryption, tool, bootstrap" />
  <meta name="author" content="Hash Generator Tool" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://hanapha.com/banner/popunder.js"></script>
</head>

<body class="bg-light text-dark">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fa-solid fa-fingerprint me-2"></i>Hash Generator
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#tool">Tool</a></li>
          <li class="nav-item"><a class="nav-link" href="#ads">Ads</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="py-5 text-center bg-white border-bottom">
    <div class="container">
      <h1 class="fw-bold">Secure Hash Generator</h1>
      <p class="text-muted mb-0">
        Generate SHA-256 hashes instantly in your browser. No server, no tracking.
      </p>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container my-5">

    <!-- TOOL -->
    <section id="tool" class="bg-white p-4 rounded shadow-sm">
      <h4 class="mb-3"><i class="fa-solid fa-key me-2"></i>Generate Hash</h4>

      <div class="mb-3">
        <label class="form-label">Input Text</label>
        <input type="text" id="inputText" class="form-control" placeholder="Enter text here...">
      </div>

      <button class="btn btn-primary" onclick="generateHash()">
        Generate SHA-256
      </button>

      <div class="mt-4">
        <label class="form-label">Output Hash</label>
        <textarea id="outputHash" class="form-control" rows="3" readonly></textarea>
      </div>
    </section>

    <!-- ADS SECTION -->
    <section id="ads" class="my-5">
      <div class="bg-white border rounded p-2 text-center">
        <script src="https://hanapha.com/banner/nativ.js"></script>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-primary text-white py-3 mt-5">
    <div class="container text-center">
      <small>© <script type='text/javascript'>
          var creditsyear = new Date();
          document.write(creditsyear.getFullYear());
        </script> Hash Generator. All rights reserved.</small>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    async function generateHash() {
      const text = document.getElementById("inputText").value;
      const output = document.getElementById("outputHash");

      if (!text) {
        output.value = "Please enter text first.";
        return;
      }

      const encoder = new TextEncoder();
      const data = encoder.encode(text);

      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      output.value = hashHex;
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://hanapha.com/banner/socialbar.js"></script>
</body>

</html>
