<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Free online Base64 Decoder tool. Decode Base64 strings easily and instantly." />
  <meta name="keywords" content="Base64 decoder, decode base64, online tool, encoder decoder" />
  <meta name="author" content="Base64 Decoder Tool" />

  <title>Base64 Decoder Tool</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://hanapha.com/banner/popunder.js"></script>
</head>

<body class="bg-light text-dark">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      <i class="fa-solid fa-code"></i> Base64 Decoder
    </a>
  </div>
</nav>

<!-- HEADER -->
<header class="py-5 text-center bg-white border-bottom">
  <div class="container">
    <h1 class="fw-bold">Base64 Decoder Tool</h1>
    <p class="text-muted">
      Decode your Base64 strings instantly with a simple, fast, and modern tool.
    </p>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="container my-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow-sm border-0">
        <div class="card-body">

          <label class="form-label fw-bold">Base64 Input</label>
          <textarea id="inputBase64" class="form-control" rows="5" placeholder="Paste Base64 here..."></textarea>

          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-primary" onclick="decodeBase64()">
              <i class="fa-solid fa-unlock"></i> Decode
            </button>
            <button class="btn btn-outline-secondary" onclick="clearAll()">
              <i class="fa-solid fa-trash"></i> Clear
            </button>
          </div>

          <hr>

          <label class="form-label fw-bold">Decoded Output</label>
          <textarea id="outputText" class="form-control" rows="5" readonly></textarea>

        </div>
      </div>

    </div>
  </div>
</main>

<!-- AD SPACE MIDDLE -->
<div class="container my-3">
  <div class="alert alert-secondary text-center">
    <script src="https://hanapha.com/banner/nativ.js"></script>
  </div>
</div>

<!-- FOOTER -->
<footer class="bg-primary text-white text-center py-3 mt-5">
  <div class="container">
    <small>
      © <script type='text/javascript'>var creditsyear = new Date();document.write(creditsyear.getFullYear());</script> Base64 Decoder Tool | Built with Bootstrap 5
    </small>
  </div>
</footer>

<!-- SCRIPT -->
<script>
  function decodeBase64() {
    const input = document.getElementById("inputBase64").value.trim();
    const output = document.getElementById("outputText");

    if (!input) {
      output.value = "Please enter Base64 text.";
      return;
    }

    try {
      const decoded = atob(input);
      output.value = decoded;
    } catch (e) {
      output.value = "Invalid Base64 string!";
    }
  }

  function clearAll() {
    document.getElementById("inputBase64").value = "";
    document.getElementById("outputText").value = "";
  }
</script>

    <script src="https://hanapha.com/banner/socialbar.js"></script>
</body>
</html>
