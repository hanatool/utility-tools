<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no'
        name='viewport' />
    <meta name="description" content="Modern Random Number Generator built with Bootstrap 5">
    <meta name="keywords" content="Random Number Generator, Bootstrap, RNG Tool">
    <meta name="author" content="OpenAI">
    <meta name="robots" content="index, follow">

    <title>Random Number Generator</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-light text-dark">

    <!-- Header -->
    <header class="border-bottom bg-white sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light bg-white">
            <div class="container">
                <a class="navbar-brand fw-bold text-decoration-none text-dark" href="#">
                    <i class="fa-solid fa-dice me-2 text-primary"></i>
                    Random Number Generator
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow-1">
        <div class="container py-5">

            <!-- Description -->
            <div class="row justify-content-center mb-4">
                <div class="col-lg-8 text-center">
                    <h2 class="fw-bold mb-3">Generate Random Numbers Instantly</h2>
                    <p class="text-secondary">
                        This simple and modern random number generator helps you quickly generate
                        numbers between your chosen minimum and maximum values.
                    </p>
                </div>
            </div>

            <!-- Generator Card -->
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Minimum Number</label>
                                <input type="number" id="minNumber" class="form-control form-control-lg" value="1">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Maximum Number</label>
                                <input type="number" id="maxNumber" class="form-control form-control-lg" value="100">
                            </div>

                            <div class="d-grid mb-4">
                                <button class="btn btn-primary btn-lg rounded-3" onclick="generateNumber()">
                                    <i class="fa-solid fa-wand-magic-sparkles me-2"></i>
                                    Generate Number
                                </button>
                            </div>

                            <div class="text-center">
                                <h3 class="fw-bold text-primary">Result</h3>
                                <div id="result" class="display-4 fw-bold mt-3">
                                    0
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- Advertisement Area -->
            <div class="row justify-content-center mt-5">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body text-center py-5">
                            <p class="text-muted mb-2">
                                <i class="fa-solid fa-rectangle-ad me-2"></i>
                                Advertisement Space
                            </p>
                            <small class="text-secondary">
                                Place your ads here
                            </small>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top mt-auto">
        <div class="container py-3 text-center">
            <p class="mb-0 text-secondary">
                © <script type='text/javascript'>
                    var creditsyear = new Date();
                    document.write(creditsyear.getFullYear());
                </script> Random Number Generator. All rights reserved.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script -->
    <script>
        function generateNumber() {
            const min = parseInt(document.getElementById('minNumber').value);
            const max = parseInt(document.getElementById('maxNumber').value);

            if (isNaN(min) || isNaN(max)) {
                alert('Please enter valid numbers.');
                return;
            }

            if (min > max) {
                alert('Minimum number cannot be greater than maximum number.');
                return;
            }

            const randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;

            document.getElementById('result').innerText = randomNumber;
        }
    </script>

</body>

</html>
