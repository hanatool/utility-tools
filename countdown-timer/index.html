<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no' name='viewport' />
    <meta name="description" content="Modern Countdown Timer Web App built with Bootstrap 5">
    <meta name="keywords" content="countdown, timer, bootstrap, simple timer, event countdown">
    <meta name="author" content="Countdown Timer App">

    <title>Countdown Timer</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="fa-solid fa-hourglass-half text-primary"></i> Countdown Timer
        </a>
    </div>
</nav>

<!-- HEADER -->
<header class="py-5 text-center bg-white">
    <div class="container">
        <h1 class="fw-bold">Event Countdown Timer</h1>
        <p class="text-muted">Track your important events in real time with a clean and simple design.</p>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="container my-5">

    <!-- AD SECTION -->
    <div class="alert alert-secondary text-center mb-4">
        <strong>Advertisement Space</strong> (You can place ads here)
    </div>

    <!-- INPUT CARD -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <label class="form-label fw-semibold">Select Date & Time</label>
            <input type="datetime-local" id="targetDate" class="form-control mb-3">
            <button class="btn btn-primary w-100" onclick="startCountdown()">
                Start Countdown
            </button>
        </div>
    </div>

    <!-- COUNTDOWN DISPLAY -->
    <div class="row text-center g-3">
        <div class="col-6 col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h2 id="days">0</h2>
                    <p class="text-muted">Days</p>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h2 id="hours">0</h2>
                    <p class="text-muted">Hours</p>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h2 id="minutes">0</h2>
                    <p class="text-muted">Minutes</p>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h2 id="seconds">0</h2>
                    <p class="text-muted">Seconds</p>
                </div>
            </div>
        </div>
    </div>

</main>

<!-- FOOTER -->
<footer class="bg-white border-top py-3 mt-5">
    <div class="container text-center text-muted">
        <small>&copy; 2026 Countdown Timer. All rights reserved.</small>
    </div>
</footer>

<!-- SCRIPT -->
<script>
    let countdownInterval;

    function startCountdown() {
        const input = document.getElementById("targetDate").value;
        const targetTime = new Date(input).getTime();

        if (!input) {
            alert("Please select a valid date and time.");
            return;
        }

        clearInterval(countdownInterval);

        countdownInterval = setInterval(function () {
            const now = new Date().getTime();
            const distance = targetTime - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("days").innerText = 0;
                document.getElementById("hours").innerText = 0;
                document.getElementById("minutes").innerText = 0;
                document.getElementById("seconds").innerText = 0;
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }, 1000);
    }
</script>

</body>
</html>
