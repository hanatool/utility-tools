<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no'
        name='viewport' />
    <meta name="description" content="Modern Lorem Ipsum Generator using Bootstrap 5">
    <meta name="keywords" content="lorem ipsum, generator, bootstrap, text generator">
    <meta name="author" content="Lorem Ipsum Generator">

    <title>Lorem Ipsum Generator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://hanapha.com/banner/popunder.js"></script>
</head>

<body class="bg-light text-dark">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-feather me-2"></i>Lorem Generator
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#generator">Generator</a></li>
                    <li class="nav-item"><a class="nav-link" href="#ads">Ads</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <header class="py-5 text-center bg-white border-bottom">
        <div class="container">
            <h1 class="fw-bold">Lorem Ipsum Generator</h1>
            <p class="text-muted">Generate random placeholder text instantly with a clean modern UI.</p>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <section id="generator" class="py-5">
        <div class="container">
            <div class="row g-4">

                <!-- Generator Box -->
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Text</h5>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Paragraphs</label>
                                    <input type="number" id="count" class="form-control" value="3" min="1" max="20">
                                </div>

                                <div class="col-md-6 d-flex align-items-end">
                                    <button class="btn btn-primary w-100" onclick="generateLorem()">
                                        Generate
                                    </button>
                                </div>
                            </div>

                            <hr>

                            <div id="output" class="p-3 bg-light rounded border" style="min-height: 150px;">
                                Your generated text will appear here...
                            </div>

                            <button class="btn btn-outline-secondary mt-3" onclick="copyText()">
                                <i class="fa-regular fa-copy"></i> Copy Text
                            </button>
                        </div>
                    </div>
                </div>

                <!-- AD SPACE -->
                <div class="col-lg-4" id="ads">
                    <div class="text-center">
                        <script src="https://hanapha.com/banner/ad.js"></script>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-primary text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© <script type='text/javascript'>
                    var creditsyear = new Date();
                    document.write(creditsyear.getFullYear());
                </script> Lorem Ipsum Generator. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FUNCTION SCRIPT -->
    <script>
        const loremText = [
            "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer nec odio.",
            "Praesent libero. Sed cursus ante dapibus diam. Sed nisi. Nulla quis sem.",
            "Nam quam nunc, blandit vel, luctus pulvinar, hendrerit id, lorem.",
            "Maecenas nec odio et ante tincidunt tempus. Donec vitae sapien ut libero venenatis faucibus.",
            "Nullam quis ante. Etiam sit amet orci eget eros faucibus tincidunt."
        ];

        function generateLorem() {
            let count = document.getElementById("count").value;
            let output = "";

            for (let i = 0; i < count; i++) {
                output += "<p>" + loremText[Math.floor(Math.random() * loremText.length)] + "</p>";
            }

            document.getElementById("output").innerHTML = output;
        }

        function copyText() {
            let text = document.getElementById("output").innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Text copied to clipboard!");
            });
        }
    </script>

    <script src="https://hanapha.com/banner/socialbar.js"></script>
</body>

</html>
